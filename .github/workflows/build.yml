name: Build Pumpkin (patch set)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - name: Download Pumpkin source
        run: |
          curl -L --fail -o pumpkin.tar.gz "https://api.github.com/repos/Pumpkin-MC/Pumpkin/tarball/0.2.2%2B26.3-26.60"
          mkdir -p src
          tar -xzf pumpkin.tar.gz -C src --strip-components=1

      # Every local fix lives in this ONE file. Nothing else to keep in sync.
