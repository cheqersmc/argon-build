      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build
        run: |
          cd src
          cargo build --release --bin pumpkin

      - name: Show result
        run: |
          ls -lh src/target/release/pumpkin
          sha256sum src/target/release/pumpkin

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: pumpkin-linux
          path: src/target/release/pumpkin
