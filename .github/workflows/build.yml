name: Build Pumpkin (patch set)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - name: Download Pumpkin source
        run: |
          curl -L --fail -o pumpkin.tar.gz "https://api.github.com/repos/Pumpkin-MC/Pumpkin/tarball/0.2.2%2B26.3-26.60"
          mkdir -p src
          tar -xzf pumpkin.tar.gz -C src --strip-components=1

      - name: Apply all local fixes
        run: |
          set -e
          P=""
          P="${P}"
          P="${P}"
          P="${P}"
          P="${P}"
          P="${P}"
          P="${P}"
          P="${P}"
          P="${P}"
          P="${P}"
          P="${P}"
          P="${P}"
          P="${P}"
          P="${P}"
          P="${P}"
          P="${P}"
          P="${P}"
          P="${P}"
          P="${P}"
          P="${P}"
          P="${P}"
          P="${P}"
          P="${P}"
          P="${P}"
          P="${P}"
          P="${P}"
          P="${P}"
          P="${P}"
          printf %s "$P" | base64 -d > /tmp/fixes.patch
          wc -c /tmp/fixes.patch
          test -s /tmp/fixes.patch || { echo "PATCH PAYLOAD EMPTY - aborting"; exit 1; }
          echo "diffs in patch: $(grep -c ^--- a/ /tmp/fixes.patch)"
          cd src
          patch -p1 --batch --fuzz=0 < /tmp/fixes.patch
          if ! grep -q "0.458 * f64::from(lunge_level)" crates/pumpkin-core/src/item/items/spear.rs; then echo "CANARY MISS: lunge 0.458"; exit 1; fi
          if ! grep -q "ItemMaceSmashAir" crates/pumpkin-core/src/entity/player.rs; then echo "CANARY MISS: smash_air"; exit 1; fi
          if ! grep -q ") * 1.22" crates/pumpkin-core/src/entity/projectile/wind_charge.rs; then echo "CANARY MISS: wind 1.22"; exit 1; fi
          if ! grep -q "12.0 + 2.0 * (fall - 3.0)" crates/pumpkin-core/src/entity/player.rs; then echo "CANARY MISS: mace curve"; exit 1; fi
          echo "== all 13 patches applied and verified =="

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build
        run: |
          cd src
          cargo build --release --bin pumpkin

      - name: Show result
        run: |
          ls -lh src/target/release/pumpkin
          sha256sum src/target/release/pumpkin

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: pumpkin-linux
          path: src/target/release/pumpkin
