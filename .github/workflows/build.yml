name: Build Pumpkin (patch set)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - name: Get the patches
        uses: actions/checkout@v4

      - name: Download Pumpkin source
        run: |
          curl -L --fail -o pumpkin.tar.gz "https://api.github.com/repos/Pumpkin-MC/Pumpkin/tarball/0.2.2%2B26.3-26.60"
          mkdir -p src
          tar -xzf pumpkin.tar.gz -C src --strip-components=1

      - name: Apply patches
        run: |
          set -e
          cd src
          count=0
          for p in ../patches/*.patch; do
            echo "== applying $(basename "$p")"
            patch -p1 --batch --fuzz=0 < "$p"
            count=$((count+1))
          done
          echo "== applied $count patch(es)"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build
        run: |
          cd src
          cargo build --release --bin pumpkin

      - name: Show result
        run: |
          ls -lh src/target/release/pumpkin
          sha256sum src/target/release/pumpkin

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: pumpkin-linux
          path: src/target/release/pumpkin
